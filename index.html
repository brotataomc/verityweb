<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verity</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #231F20; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    #gameContainer { position: absolute; inset: 0; width: 100%; height: 100%; }
    #gameContainer canvas { width: 100% !important; height: 100% !important; display: block; background: #231F20; }
    #loadingBar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; z-index: 5; }
    #loadingTitle { font-size: 28px; font-weight: bold; margin-bottom: 16px; letter-spacing: 1px; }
    #barEmpty { width: 260px; height: 18px; margin: 0 auto; background: #444; border-radius: 9px; overflow: hidden; }
    #barFull { width: 0%; height: 100%; background: #fff; }
    #loadingText { margin-top: 10px; font-size: 14px; }
    #fullscreenButton { position: absolute; right: 12px; bottom: 12px; width: 38px; height: 38px; cursor: pointer; opacity: .7; border: 0; border-radius: 6px; z-index: 6; background: rgba(0,0,0,.55) center/22px no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='white'><path d='M3 3h7v2H5v5H3zM14 3h7v7h-2V5h-5zM3 14h2v5h5v2H3zM19 14h2v7h-7v-2h5z'/></svg>"); }
    #fullscreenButton:hover { opacity: 1; }
  </style>
  <script src="Build/UnityLoader.js"></script>
  <script>
    // Old-style (Unity 2017/2018) WebGL build: Build/folder.json is the manifest.
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/folder.json", {
      onProgress: function (instance, progress) {
        var pct = Math.round(progress * 100);
        document.getElementById("barFull").style.width = pct + "%";
        document.getElementById("loadingText").textContent = pct + "%";
        if (progress === 1) {
          setTimeout(function () {
            document.getElementById("loadingBar").style.display = "none";
          }, 300);
        }
      }
    });
    window.addEventListener("load", function () {
      document.getElementById("fullscreenButton").onclick = function () {
        gameInstance.SetFullscreen(1);
      };
    });
  </script>
</head>
<body>
  <div id="gameContainer"></div>
  <div id="loadingBar">
    <div id="loadingTitle">THE Verity Mod</div>
    <div id="barEmpty"><div id="barFull"></div></div>
    <div id="loadingText">Loading... 0%</div>
  </div>
  <button id="fullscreenButton" title="Fullscreen" aria-label="Fullscreen"></button>
</body>
</html>
