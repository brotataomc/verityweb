<!DOCTYPE html>
<html lang="en-us">

<head>

    <meta charset="utf-8">

    <title>THE Verity Mod (beta)</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;

            z-index: 10;
        }

    </style>

</head>

<body>

    <div id="loading">
        LOADING...
    </div>

    <div id="gameContainer"></div>


    <script>

        const BASE_URL = "./";


        async function fetchWithProgress(url) {

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Failed to download: " + url
                );
            }

            const reader = response.body.getReader();

            const contentLength =
                response.headers.get("Content-Length");

            let received = 0;
            let chunks = [];

            while (true) {

                const { done, value } =
                    await reader.read();

                if (done)
                    break;

                chunks.push(value);

                received += value.length;

                if (contentLength) {

                    const percent =
                        Math.floor(
                            (received /
                                parseInt(contentLength)) *
                            100
                        );

                    document.getElementById("loading")
                        .textContent =
                        "LOADING... " + percent + "%";
                }
            }

            const buffer =
                new Uint8Array(received);

            let offset = 0;

            for (const chunk of chunks) {

                buffer.set(chunk, offset);

                offset += chunk.length;
            }

            return buffer.buffer;
        }


        function getParts(file, start, end) {

            const parts = [];

            for (let i = start; i <= end; i++) {

                parts.push(
                    BASE_URL +
                    file +
                    ".part" +
                    i
                );

            }

            return parts;
        }


        async function mergeFiles(fileParts) {

            const buffers =
                await Promise.all(
                    fileParts.map(
                        fetchWithProgress
                    )
                );

            const mergedBlob =
                new Blob(buffers);

            return URL.createObjectURL(
                mergedBlob
            );
        }


        async function startGame() {

            try {

                document.getElementById("loading")
                    .textContent =
                    "LOADING GAME DATA...";


                /*
                 * Merge the two pieces of the
                 * Unity .data.unityweb file.
                 */

                const dataUrl =
                    await mergeFiles(
                        getParts(
                            "Build/THE Verity Mod (beta).data.unityweb",
                            1,
                            2
                        )
                    );


                /*
                 * UnityLoader will ask for the
                 * original .data.unityweb filename.
                 *
                 * Redirect that request to our
                 * merged Blob.
                 */

                const originalOpen =
                    XMLHttpRequest.prototype.open;


                XMLHttpRequest.prototype.open =
                    function(method, url, ...rest) {

                        const decodedUrl =
                            decodeURIComponent(url);


                        if (
                            decodedUrl.includes(
                                "THE Verity Mod (beta).data.unityweb"
                            )
                        ) {

                            url = dataUrl;

                        }


                        return originalOpen.call(
                            this,
                            method,
                            url,
                            ...rest
                        );

                    };


                /*
                 * Load Unity's WebGL loader.
                 */

                const script =
                    document.createElement("script");

                script.src =
                    "Build/UnityLoader.js";


                script.onload = function() {

                    document.getElementById("loading")
                        .style.display = "none";


                    /*
                     * Start the Unity game.
                     */

                    UnityLoader.instantiate(
                        "gameContainer",
                        "Build/THE Verity Mod (beta).json"
                    );

                };


                script.onerror = function() {

                    document.getElementById("loading")
                        .textContent =
                        "ERROR LOADING UNITYLOADER.JS";

                };


                document.body.appendChild(
                    script
                );


            }
            catch (error) {

                console.error(error);

                document.getElementById("loading")
                    .textContent =
                    "ERROR: " + error.message;

            }

        }


        startGame();

    </script>

</body>

</html>
